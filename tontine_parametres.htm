 <!--  <div class="w3-content w3-grid"

    <h1>Tontine</h1>
	<form id="parametres" class="w3-container">
			<p>
				<label for="MtTotal">Montant total (XAF)</label>
				<input id="MtTotal" class="w3-input" type="number" size="7" min="1000" max="99999999">
			</p>
			<p>
				<label for="periode">Période</label>
				<select id="periode" class="w3-select">
					<option id="mois" disabled selected>Choisir...</option>
					<option id="mois" value="M">mensuel</option>
					<option id="mois" value="H">hebdomadaire</option>
					<option id="mois" value="T">trimestriel</option>
				</select>
			</p>
			<p>
				<label for="NbPers">Nb de participants (2-99)</label>
				<input id="NbPers" class="w3-input" type="number" size="3" min="2" max="99">
			</p>
			<p>
				<label for="MtUnitaire">Montant unitaire (XAF)</label>
				<input id="MtUnitaire" class="w3-input" type="number" size="7" min="1000" max="99999999">
			</p>
	</form>
	
</section>
